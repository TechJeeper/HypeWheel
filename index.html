
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HypeWheel - Random Name Picker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['system-ui', '-apple-system', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar */
        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-track { background: transparent; }
        textarea::-webkit-scrollbar-thumb { background-color: #4b5563; border-radius: 10px; }
        .dark textarea::-webkit-scrollbar-thumb { background-color: #374151; }
        
        /* Smooth transitions */
        .wheel-container { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .theater-mode {
            position: fixed !important; inset: 0 !important; z-index: 50 !important;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            border-radius: 0 !important; height: 100vh !important; width: 100vw !important;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300 flex flex-col">

    <!-- NAVBAR -->
    <nav id="navbar" class="px-4 md:px-6 py-4 flex justify-between items-center bg-white/90 dark:bg-gray-800/90 backdrop-blur shadow-sm border-b border-gray-300 dark:border-gray-700 sticky top-0 z-40 transition-colors duration-300">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg text-white">
                <i data-lucide="rotate-cw" class="w-5 h-5"></i>
            </div>
            <h1 class="text-xl md:text-2xl font-black tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-500 to-purple-500">
                HypeWheel
            </h1>
        </div>
        <div class="flex items-center space-x-2 md:space-x-3">
            <button id="btn-winners" class="flex items-center p-2 md:px-4 md:py-2 rounded-full font-bold transition-all bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 border border-gray-300 dark:border-gray-600 text-sm md:text-base">
                <i data-lucide="trophy" class="w-4 h-4 text-yellow-500 md:mr-2"></i> 
                <span class="hidden md:inline">Winners</span>
                <span id="winners-badge" class="ml-2 bg-yellow-500 text-white text-xs px-2 py-0.5 rounded-full hidden">0</span>
            </button>
            <button id="btn-add-wheel" class="flex items-center px-3 py-2 md:px-4 md:py-2 rounded-full font-bold shadow transition-all bg-indigo-600 hover:bg-indigo-700 text-white text-sm md:text-base">
                <i data-lucide="plus-circle" class="w-4 h-4 md:mr-2"></i> 
                <span class="hidden md:inline">Add Wheel</span>
            </button>
            <button id="btn-theme" class="p-2 rounded-full border border-gray-300 dark:border-gray-600 bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 transition-all" title="Toggle Theme">
                <span id="theme-icon">☀️</span>
            </button>
        </div>
    </nav>

    <!-- WORKSPACE -->
    <main id="workspace" class="p-4 md:p-6 w-full max-w-[1920px] mx-auto grid grid-cols-1 lg:grid-cols-2 gap-6 flex-1">
        <!-- Wheels injected here via JS -->
    </main>

    <!-- FOOTER -->
    <footer id="main-footer" class="w-full text-center p-6 text-sm text-gray-500 dark:text-gray-400">
        Provided free by <a href="https://TechJeeper.com" target="_blank" rel="noopener noreferrer" class="font-semibold text-indigo-600 dark:text-indigo-400 hover:text-indigo-500 hover:underline transition-colors">TechJeeper Designs</a>
    </footer>

    <!-- WINNERS MODAL -->
    <div id="winners-modal" class="fixed inset-0 z-[60] hidden flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 opacity-0 transition-opacity duration-300">
        <div class="w-full max-w-lg rounded-2xl shadow-2xl flex flex-col max-h-[80vh] bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 transform scale-95 transition-transform duration-300" id="winners-modal-content">
            <div class="flex justify-between items-center p-5 border-b border-gray-300 dark:border-gray-700">
                <h2 class="text-xl font-bold flex items-center">
                    <i data-lucide="trophy" class="w-5 h-5 text-yellow-500 mr-2"></i> Winners History
                </h2>
                <button id="btn-close-winners" class="p-2 rounded-lg bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="winners-list" class="flex-1 overflow-y-auto p-2">
                <!-- Winners injected here -->
            </div>
            <div class="p-4 border-t border-gray-300 dark:border-gray-700 flex justify-between gap-3">
               <button id="btn-clear-winners" class="px-4 py-2 rounded-lg font-semibold text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 transition-colors disabled:opacity-50">
                 Clear History
               </button>
               <button id="btn-export-winners" class="flex items-center px-6 py-2 rounded-lg font-bold transition-all bg-indigo-600 hover:bg-indigo-700 text-white disabled:opacity-50">
                 <i data-lucide="download" class="w-4 h-4 mr-2"></i> Export CSV
               </button>
            </div>
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-[70] flex flex-col gap-2 pointer-events-none"></div>

    <!-- APPLICATION LOGIC -->
    <script>
        // --- CONSTANTS & UTILS ---
        const PALETTES = {
            rainbow: ['#ef4444', '#f97316', '#eab308', '#22c55e', '#06b6d4', '#3b82f6', '#8b5cf6', '#d946ef'],
            neon: ['#ff00ff', '#00ffff', '#00ff00', '#ffff00', '#ff0000', '#0000ff'],
            pastel: ['#fecaca', '#fed7aa', '#fef08a', '#bbf7d0', '#bfdbfe', '#e9d5ff', '#fbcfe8'],
            monochrome: ['#1e293b', '#334155', '#475569', '#64748b', '#94a3b8', '#cbd5e1'],
            synthwave: ['#ff007c', '#7928ca', '#00f0ff', '#facc15', '#ff4d4d']
        };

        const getCryptoRandom = () => {
            const array = new Uint32Array(1);
            window.crypto.getRandomValues(array);
            return array[0] / (0xFFFFFFFF + 1);
        };

        const generateSeed = () => {
            const array = new Uint8Array(4);
            window.crypto.getRandomValues(array);
            return Array.from(array, byte => byte.toString(16).padStart(2, '0')).join('').toUpperCase();
        };

        const easeOutQuart = (x) => 1 - Math.pow(1 - x, 4);

        const showToast = (message, type = 'info') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-blue-600';
            const icon = type === 'success' ? 'check' : type === 'error' ? 'alert-circle' : 'info';
            
            toast.className = `${bg} text-white px-6 py-3 rounded-lg shadow-lg flex items-center space-x-3 transform transition-all duration-300 translate-y-10 opacity-0`;
            toast.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            lucide.createIcons({ root: toast });

            requestAnimationFrame(() => toast.classList.remove('translate-y-10', 'opacity-0'));

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        // --- GLOBAL STATE ---
        let appState = {
            theme: localStorage.getItem('appTheme') || 'dark',
            winners: JSON.parse(localStorage.getItem('winnersData') || '[]'),
            wheelsConfig: JSON.parse(localStorage.getItem('wheelsData') || 'null'),
            theaterModeId: null
        };

        if (!appState.wheelsConfig) {
            appState.wheelsConfig = [{
                id: 'default', title: 'Main Giveaway', 
                rawText: 'Alice\nBob\nCharlie\nDave\nEve\nFrank', 
                palette: 'rainbow', seed: generateSeed(), centerImage: ''
            }];
        }

        const saveState = () => {
            localStorage.setItem('appTheme', appState.theme);
            localStorage.setItem('winnersData', JSON.stringify(appState.winners));
        };

        // --- WHEEL INSTANCE CLASS ---
        class WheelApp {
            constructor(config, container) {
                this.id = config.id;
                this.title = config.title;
                this.rawText = config.rawText;
                this.palette = config.palette || 'rainbow';
                this.centerImage = config.centerImage || '';
                this.seed = config.seed || generateSeed();
                
                this.entries = this.parseEntries(this.rawText);
                this.isSpinning = false;
                this.isShuffling = false; 
                this.currentAngle = 0;
                this.animationRef = null;
                this.autoShuffleCount = 10;
                this.showSettings = false;
                
                this.container = container;
                this.buildDOM();
                this.bindEvents();
                this.draw();
                
                this.resizeObserver = new ResizeObserver(() => this.handleResize());
                this.resizeObserver.observe(this.dom.canvasContainer);
            }

            parseEntries(text) {
                return text.split('\n').map(e => e.trim()).filter(e => e !== '');
            }

            saveConfig() {
                const conf = appState.wheelsConfig.find(w => w.id === this.id);
                if (conf) {
                    conf.title = this.title;
                    conf.rawText = this.rawText;
                    conf.palette = this.palette;
                    conf.centerImage = this.centerImage;
                    conf.seed = this.seed;
                    localStorage.setItem('wheelsData', JSON.stringify(appState.wheelsConfig));
                }
            }

            buildDOM() {
                const wrapper = document.createElement('div');
                wrapper.className = `wheel-container flex flex-col h-full rounded-2xl shadow-xl bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 min-h-[650px] relative`;
                wrapper.id = `wheel-${this.id}`;

                wrapper.innerHTML = `
                    <!-- HEADER -->
                    <div class="flex justify-between items-center p-4 border-b border-gray-300 dark:border-gray-700 header-area">
                        <div class="flex items-center space-x-3 flex-1">
                            <input type="text" class="title-input font-bold text-xl bg-transparent border-none focus:ring-0 outline-none w-full text-gray-900 dark:text-gray-100" value="${this.title}" placeholder="Wheel Title">
                        </div>
                        <div class="flex space-x-2 shrink-0">
                            <button class="btn-settings p-2 rounded-lg bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-900 dark:text-white" title="Settings"><i data-lucide="settings" class="w-4 h-4"></i></button>
                            <button class="btn-theater p-2 rounded-lg bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-900 dark:text-white" title="Theater Mode"><i data-lucide="maximize" class="w-4 h-4 theater-icon"></i></button>
                            <button class="btn-delete p-2 rounded-lg hover:bg-red-600 hover:text-white text-red-500 dark:text-red-400 transition-colors" title="Delete Wheel"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </div>

                    <!-- SETTINGS -->
                    <div class="settings-panel hidden p-4 border-b border-gray-300 dark:border-gray-700 grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                        <div>
                            <label class="block mb-1 font-semibold text-gray-900 dark:text-white">Color Palette</label>
                            <select class="palette-select w-full p-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-white outline-none">
                                ${Object.keys(PALETTES).map(p => `<option value="${p}" ${this.palette === p ? 'selected' : ''}>${p.charAt(0).toUpperCase() + p.slice(1)}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block mb-1 font-semibold text-gray-900 dark:text-white">Center Image URL (Optional)</label>
                            <div class="flex">
                                <span class="p-2 rounded-l-lg bg-gray-200 dark:bg-gray-600 flex items-center"><i data-lucide="image" class="w-4 h-4"></i></span>
                                <input type="text" class="image-input w-full p-2 rounded-r-lg bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-white outline-none" placeholder="https://..." value="${this.centerImage}">
                            </div>
                        </div>
                    </div>

                    <!-- MAIN AREA -->
                    <div class="flex flex-1 overflow-hidden flex-col workspace-area">
                        <!-- CANVAS -->
                        <div class="canvas-container flex-1 relative flex flex-col items-center justify-center p-2 md:p-4 min-h-[300px]">
                            <div class="absolute top-2 left-2 md:top-4 md:left-4 z-10 flex items-center space-x-2 bg-black/50 backdrop-blur px-3 py-1.5 rounded-full text-xs text-white shadow font-mono">
                                <span>Seed:</span>
                                <span class="seed-display text-green-400 font-bold">${this.seed}</span>
                            </div>
                            <canvas class="wheel-canvas max-w-full transition-transform active:scale-[0.98] cursor-pointer hover:scale-[1.02]"></canvas>
                            
                            <!-- WINNER OVERLAY -->
                            <div class="winner-overlay absolute inset-0 z-20 hidden flex-col items-center justify-center bg-black/60 backdrop-blur-sm transition-opacity opacity-0">
                                <div class="bg-gradient-to-br from-indigo-600 to-purple-600 p-6 md:p-8 rounded-3xl shadow-2xl text-center transform scale-105 border-4 border-yellow-400 m-4 w-full max-w-sm md:max-w-md">
                                    <h2 class="text-yellow-300 text-xl font-bold uppercase tracking-widest mb-2">Winner!</h2>
                                    <p class="winner-text text-white text-4xl md:text-5xl font-extrabold drop-shadow-lg mb-6 break-all"></p>
                                    <div class="flex flex-col md:flex-row gap-3">
                                        <button class="btn-remove-winner bg-red-500 hover:bg-red-600 text-white px-6 py-3 rounded-full font-bold transition-colors w-full md:w-auto shadow-lg flex-1">Remove Name</button>
                                        <button class="btn-keep-winner bg-white/20 hover:bg-white/30 text-white px-6 py-3 rounded-full font-bold transition-colors w-full md:w-auto flex-1">Keep Name</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- CONTROLS -->
                        <div class="controls-area flex flex-col p-4 shrink-0 border-t border-gray-300 dark:border-gray-700 transition-all duration-300">
                            
                            <div class="hide-in-theater">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="entries-count font-semibold text-gray-900 dark:text-white">Entries (${this.entries.length})</span>
                                    <div class="flex space-x-1">
                                        <button class="btn-dedupe p-1.5 rounded bg-gray-200 dark:bg-gray-700 text-xs text-gray-900 dark:text-white hover:bg-gray-300 dark:hover:bg-gray-600"><i data-lucide="copy" class="w-3.5 h-3.5 inline mr-1"></i> Dedupe</button>
                                        <button class="btn-clear p-1.5 rounded hover:bg-red-600 hover:text-white bg-red-500/10 text-red-500 dark:text-red-400 text-xs"><i data-lucide="trash-2" class="w-3.5 h-3.5 inline mr-1"></i> Clear</button>
                                    </div>
                                </div>
                                <textarea class="entries-input flex-1 w-full p-3 rounded-lg resize-none outline-none bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white border-2 border-transparent focus:border-gray-300 dark:focus:border-gray-600 transition-colors min-h-[120px] font-medium leading-relaxed" placeholder="Paste your names here...\nOne name per line.">${this.rawText}</textarea>
                            </div>

                            <div class="grid grid-cols-2 gap-2 mt-4 shuffle-grid">
                                <button class="btn-shuffle flex items-center justify-center p-3 rounded-lg font-bold transition-colors bg-gray-200 dark:bg-gray-700 text-gray-900 dark:text-white hover:bg-gray-300 dark:hover:bg-gray-600 disabled:opacity-50"><i data-lucide="shuffle" class="w-4 h-4 mr-2"></i> Shuffle</button>
                                <div class="flex rounded-lg overflow-hidden border border-gray-300 dark:border-gray-600 bg-gray-200 dark:bg-gray-700">
                                    <input type="number" min="1" max="50" value="10" class="auto-shuffle-input w-12 text-center bg-transparent outline-none text-gray-900 dark:text-white text-sm font-bold">
                                    <button class="btn-auto-shuffle flex-1 flex items-center justify-center text-sm font-bold transition-colors text-gray-900 dark:text-white hover:bg-black/10 disabled:opacity-50"><i data-lucide="rotate-cw" class="w-4 h-4 mr-1"></i> Auto</button>
                                </div>
                            </div>

                            <button class="btn-spin mt-4 w-full py-4 rounded-xl font-black text-2xl tracking-wider text-white shadow-lg transition-all transform active:scale-95 disabled:opacity-50 disabled:active:scale-100 flex items-center justify-center bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 spin-btn-visual">
                                <i data-lucide="play" class="w-6 h-6 mr-2 fill-current"></i> SPIN
                            </button>
                        </div>
                    </div>
                `;

                this.container.appendChild(wrapper);
                this.dom = {
                    wrapper,
                    titleInput: wrapper.querySelector('.title-input'),
                    btnSettings: wrapper.querySelector('.btn-settings'),
                    btnTheater: wrapper.querySelector('.btn-theater'),
                    btnDelete: wrapper.querySelector('.btn-delete'),
                    settingsPanel: wrapper.querySelector('.settings-panel'),
                    paletteSelect: wrapper.querySelector('.palette-select'),
                    imageInput: wrapper.querySelector('.image-input'),
                    canvasContainer: wrapper.querySelector('.canvas-container'),
                    canvas: wrapper.querySelector('.wheel-canvas'),
                    seedDisplay: wrapper.querySelector('.seed-display'),
                    winnerOverlay: wrapper.querySelector('.winner-overlay'),
                    winnerText: wrapper.querySelector('.winner-text'),
                    btnRemoveWinner: wrapper.querySelector('.btn-remove-winner'),
                    btnKeepWinner: wrapper.querySelector('.btn-keep-winner'),
                    entriesCount: wrapper.querySelector('.entries-count'),
                    btnDedupe: wrapper.querySelector('.btn-dedupe'),
                    btnClear: wrapper.querySelector('.btn-clear'),
                    entriesInput: wrapper.querySelector('.entries-input'),
                    btnShuffle: wrapper.querySelector('.btn-shuffle'),
                    autoShuffleInput: wrapper.querySelector('.auto-shuffle-input'),
                    btnAutoShuffle: wrapper.querySelector('.btn-auto-shuffle'),
                    btnSpin: wrapper.querySelector('.btn-spin'),
                    hideInTheater: wrapper.querySelector('.hide-in-theater'),
                    controlsArea: wrapper.querySelector('.controls-area'),
                    headerArea: wrapper.querySelector('.header-area'),
                    theaterIcon: wrapper.querySelector('.theater-icon'),
                    shuffleGrid: wrapper.querySelector('.shuffle-grid'),
                    spinVisual: wrapper.querySelector('.spin-btn-visual')
                };

                lucide.createIcons({ root: wrapper });
                this.updateUIState();
            }

            bindEvents() {
                this.dom.titleInput.addEventListener('input', (e) => { this.title = e.target.value; this.saveConfig(); });
                
                this.dom.btnSettings.addEventListener('click', () => {
                    this.showSettings = !this.showSettings;
                    this.dom.settingsPanel.classList.toggle('hidden', !this.showSettings);
                });
                
                this.dom.paletteSelect.addEventListener('change', (e) => { this.palette = e.target.value; this.saveConfig(); this.draw(); });
                this.dom.imageInput.addEventListener('input', (e) => { this.centerImage = e.target.value; this.saveConfig(); this.draw(); });
                this.dom.btnDelete.addEventListener('click', () => deleteWheel(this.id));
                this.dom.btnTheater.addEventListener('click', () => toggleTheaterMode(this.id));
                
                this.dom.entriesInput.addEventListener('input', (e) => {
                    this.rawText = e.target.value;
                    this.entries = this.parseEntries(this.rawText);
                    this.dom.entriesCount.innerText = `Entries (${this.entries.length})`;
                    this.saveConfig(); this.draw(); this.updateUIState();
                });

                this.dom.btnClear.addEventListener('click', () => {
                    this.rawText = ''; this.entries = []; this.dom.entriesInput.value = '';
                    this.dom.entriesCount.innerText = `Entries (0)`;
                    this.saveConfig(); this.draw(); this.updateUIState();
                });

                this.dom.btnDedupe.addEventListener('click', () => {
                    const seenLower = new Set();
                    const unique = this.entries.filter(entry => {
                        const lower = entry.toLowerCase();
                        if (seenLower.has(lower)) return false;
                        seenLower.add(lower); return true;
                    });
                    const removed = this.entries.length - unique.length;
                    this.rawText = unique.join('\n');
                    this.entries = unique;
                    this.dom.entriesInput.value = this.rawText;
                    this.dom.entriesCount.innerText = `Entries (${this.entries.length})`;
                    this.saveConfig(); this.draw();
                    showToast(`Removed ${removed} duplicates!`, 'success');
                });

                this.dom.btnShuffle.addEventListener('click', () => this.shuffle());
                this.dom.autoShuffleInput.addEventListener('change', (e) => this.autoShuffleCount = parseInt(e.target.value) || 1);
                this.dom.btnAutoShuffle.addEventListener('click', () => this.autoShuffle());

                this.dom.btnSpin.addEventListener('click', () => this.spin());
                this.dom.canvas.addEventListener('click', () => {
                    if (!this.isSpinning && this.entries.length >= 2) this.spin();
                });

                this.dom.btnKeepWinner.addEventListener('click', () => this.closeWinner());
                this.dom.btnRemoveWinner.addEventListener('click', () => {
                    const idx = this.entries.indexOf(this.winnerName);
                    if (idx !== -1) {
                        this.entries.splice(idx, 1);
                        this.rawText = this.entries.join('\n');
                        this.dom.entriesInput.value = this.rawText;
                        this.dom.entriesCount.innerText = `Entries (${this.entries.length})`;
                        this.saveConfig(); this.draw();
                        showToast(`${this.winnerName} removed!`, 'success');
                    }
                    this.closeWinner();
                });
            }

            updateUIState() {
                const canSpin = this.entries.length >= 2 && !this.isSpinning;
                this.dom.btnSpin.disabled = !canSpin;
                this.dom.btnShuffle.disabled = this.isSpinning;
                this.dom.btnAutoShuffle.disabled = this.isSpinning;
                this.dom.entriesInput.disabled = this.isSpinning;
                
                if (this.isSpinning) {
                    this.dom.spinVisual.classList.replace('bg-gradient-to-r', 'bg-gray-600');
                    this.dom.spinVisual.classList.remove('from-blue-600', 'to-indigo-600', 'hover:from-blue-500', 'hover:to-indigo-500');
                    this.dom.btnSpin.innerHTML = this.isShuffling ? 'SHUFFLING...' : 'SPINNING...';
                } else {
                    this.dom.spinVisual.classList.add('bg-gradient-to-r', 'from-blue-600', 'to-indigo-600', 'hover:from-blue-500', 'hover:to-indigo-500');
                    this.dom.spinVisual.classList.remove('bg-gray-600');
                    this.dom.btnSpin.innerHTML = '<i data-lucide="play" class="w-6 h-6 mr-2 fill-current"></i> SPIN';
                    lucide.createIcons({ root: this.dom.btnSpin });
                }

                if (!this.isSpinning && this.entries.length >= 2) {
                    this.dom.canvas.classList.add('cursor-pointer', 'hover:scale-[1.02]');
                } else {
                    this.dom.canvas.classList.remove('cursor-pointer', 'hover:scale-[1.02]');
                }
            }

            shuffle() {
                if (this.isSpinning || this.entries.length < 2) return;
                this.entries.sort(() => getCryptoRandom() - 0.5);
                this.rawText = this.entries.join('\n');
                this.dom.entriesInput.value = this.rawText;
                this.seed = generateSeed();
                this.dom.seedDisplay.innerText = this.seed;
                this.saveConfig();
                this.draw();
            }

            async autoShuffle() {
                if (this.isSpinning || this.entries.length < 2) return;
                
                this.isSpinning = true; 
                this.isShuffling = true; 
                this.updateUIState();
                
                for (let i = 0; i < this.autoShuffleCount; i++) {
                    this.entries.sort(() => getCryptoRandom() - 0.5);
                    this.rawText = this.entries.join('\n');
                    this.dom.entriesInput.value = this.rawText;
                    this.seed = generateSeed();
                    this.dom.seedDisplay.innerText = this.seed;
                    this.draw();
                    await new Promise(r => setTimeout(r, 80));
                }
                
                this.saveConfig();
                this.isSpinning = false; 
                this.isShuffling = false; 
                this.updateUIState();
                showToast(`Shuffled ${this.autoShuffleCount} times!`, 'success');
            }

            handleResize() {
                if (!this.dom.canvasContainer) return;
                const rect = this.dom.canvasContainer.getBoundingClientRect();
                const size = Math.min(rect.width, rect.height || rect.width, 800);
                this.canvasSize = size;
                this.dom.canvas.style.width = `${size}px`;
                this.dom.canvas.style.height = `${size}px`;
                this.draw();
            }

            draw(angleOffset = this.currentAngle) {
                const canvas = this.dom.canvas;
                if (!canvas || !this.canvasSize) return;
                const ctx = canvas.getContext('2d');
                const size = this.canvasSize;
                
                const dpr = window.devicePixelRatio || 1;
                canvas.width = size * dpr;
                canvas.height = size * dpr;
                ctx.scale(dpr, dpr);
                ctx.clearRect(0, 0, size, size);
                
                const centerX = size / 2;
                const centerY = size / 2;
                const radius = Math.min(centerX, centerY) - 30;

                ctx.save();
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.shadowColor = "rgba(0,0,0,0.15)";
                ctx.shadowBlur = 24;
                ctx.shadowOffsetY = 10;
                ctx.fillStyle = '#000';
                ctx.fill();
                ctx.restore();

                if (this.entries.length === 0) {
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                    ctx.fillStyle = appState.theme === 'dark' ? '#1f2937' : '#e5e7eb';
                    ctx.fill();
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#9CA3AF';
                    ctx.font = '600 20px system-ui, sans-serif';
                    ctx.fillText('No Entries', centerX, centerY);
                    return;
                }

                const sliceAngle = (2 * Math.PI) / this.entries.length;
                const colors = PALETTES[this.palette] || PALETTES.rainbow;

                for (let i = 0; i < this.entries.length; i++) {
                    const startAngle = i * sliceAngle + angleOffset;
                    const endAngle = startAngle + sliceAngle;
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                    ctx.closePath();
                    ctx.fillStyle = colors[i % colors.length];
                    ctx.fill();
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = 'rgba(0,0,0,0.05)';
                    ctx.stroke();
                }

                for (let i = 0; i < this.entries.length; i++) {
                    const startAngle = i * sliceAngle + angleOffset;
                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.rotate(startAngle + sliceAngle / 2);
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'middle';
                    
                    const maxFontSize = 30;
                    const arcLength = radius * sliceAngle;
                    const fontSize = Math.max(12, Math.min(maxFontSize, arcLength * 0.7));
                    ctx.font = `800 ${fontSize}px system-ui, -apple-system, sans-serif`;
                    
                    const text = this.entries[i];
                    const hubRadius = radius * 0.12;
                    const rightMargin = 25;
                    const availableWidth = radius - hubRadius - rightMargin - 10;
                    
                    let displayString = text;
                    if (ctx.measureText(displayString).width > availableWidth) {
                        while (displayString.length > 0 && ctx.measureText(displayString + '...').width > availableWidth) {
                            displayString = displayString.slice(0, -1);
                        }
                        displayString = displayString.length > 0 ? displayString + '...' : '';
                    }

                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = "rgba(0,0,0,0.4)";
                    ctx.shadowBlur = 4;
                    ctx.shadowOffsetY = 1;
                    ctx.fillText(displayString, radius - rightMargin, 0);
                    ctx.restore();
                }

                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.lineWidth = 6;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.stroke();

                const hubRadius = radius * 0.12;
                ctx.beginPath();
                ctx.arc(centerX, centerY, hubRadius, 0, 2 * Math.PI);
                ctx.fillStyle = '#1e293b';
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.stroke();

                if (this.centerImage) {
                    const img = new window.Image();
                    img.src = this.centerImage;
                    if(img.complete && img.naturalWidth !== 0) {
                       ctx.save();
                       ctx.beginPath();
                       ctx.arc(centerX, centerY, hubRadius - 2, 0, 2 * Math.PI);
                       ctx.clip();
                       ctx.drawImage(img, centerX - hubRadius, centerY - hubRadius, hubRadius*2, hubRadius*2);
                       ctx.restore();
                    } else if (!img.dataset.loading) {
                       img.dataset.loading = 'true';
                       img.onload = () => this.draw();
                    }
                }

                const rightEdge = centerX + radius;
                ctx.save();
                ctx.translate(rightEdge + 8, centerY);
                ctx.shadowColor = "rgba(0,0,0,0.2)";
                ctx.shadowBlur = 8;
                ctx.shadowOffsetX = -2;
                ctx.shadowOffsetY = 2;

                ctx.beginPath();
                ctx.moveTo(-35, 0); ctx.lineTo(10, -18); ctx.lineTo(10, 18);
                ctx.closePath();
                ctx.fillStyle = '#ffffff'; ctx.fill();

                ctx.shadowColor = "transparent";
                ctx.beginPath();
                ctx.moveTo(-25, 0); ctx.lineTo(6, -12); ctx.lineTo(6, 12);
                ctx.closePath();
                ctx.fillStyle = '#3b82f6'; ctx.fill();
                ctx.restore();
            }

            spin() {
                if (this.entries.length < 2 || this.isSpinning) return;
                
                this.isSpinning = true;
                this.updateUIState();
                this.seed = generateSeed();
                this.dom.seedDisplay.innerText = this.seed;
                this.saveConfig();

                const duration = 5000 + Math.random() * 2000;
                const startAngle = this.currentAngle;
                
                const randomValue = getCryptoRandom();
                const extraSpins = 5 + Math.floor(randomValue * 5);
                const targetAngle = startAngle + (extraSpins * 2 * Math.PI) + (randomValue * 2 * Math.PI);
                
                let startTime = null;

                const animate = (time) => {
                    if (!startTime) startTime = time;
                    const elapsed = time - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    
                    const easedProgress = easeOutQuart(progress);
                    this.currentAngle = startAngle + (targetAngle - startAngle) * easedProgress;
                    
                    this.draw();

                    if (progress < 1) {
                        this.animationRef = requestAnimationFrame(animate);
                    } else {
                        this.isSpinning = false;
                        this.updateUIState();
                        
                        const normalizedAngle = this.currentAngle % (2 * Math.PI);
                        const sliceAngle = (2 * Math.PI) / this.entries.length;
                        let winningIndex = Math.floor(((2 * Math.PI) - normalizedAngle) / sliceAngle) % this.entries.length;
                        
                        this.winnerName = this.entries[winningIndex];
                        this.showWinner();
                    }
                };

                this.animationRef = requestAnimationFrame(animate);
            }

            showWinner() {
                this.dom.winnerText.innerText = this.winnerName;
                this.dom.winnerOverlay.style.display = 'flex';
                void this.dom.winnerOverlay.offsetWidth;
                this.dom.winnerOverlay.classList.remove('opacity-0');
                
                addWinner(this.title, this.winnerName);
            }

            closeWinner() {
                this.dom.winnerOverlay.classList.add('opacity-0');
                setTimeout(() => {
                    this.dom.winnerOverlay.style.display = 'none';
                }, 300);
            }

            setTheaterMode(isActive) {
                if (isActive) {
                    this.dom.wrapper.classList.add('theater-mode');
                    this.dom.headerArea.classList.replace('border-b', 'bg-black/40');
                    this.dom.headerArea.classList.add('shadow-lg', 'text-white');
                    this.dom.titleInput.classList.remove('text-gray-900', 'dark:text-gray-100');
                    this.dom.titleInput.classList.add('text-white');
                    
                    this.dom.hideInTheater.style.display = 'none';
                    this.dom.controlsArea.className = 'controls-area flex flex-col p-4 shrink-0 bg-black/30 backdrop-blur-md max-w-4xl mx-auto w-full rounded-t-3xl border-t border-white/10 pb-8 transition-all duration-300';
                    this.dom.shuffleGrid.className = 'grid grid-cols-2 gap-2 mt-2 max-w-2xl mx-auto w-full shuffle-grid';
                    this.dom.btnSpin.classList.add('max-w-2xl', 'mx-auto', 'text-3xl', 'py-5');
                    
                    this.dom.theaterIcon.setAttribute('data-lucide', 'minimize');
                } else {
                    this.dom.wrapper.classList.remove('theater-mode');
                    this.dom.headerArea.classList.replace('bg-black/40', 'border-b');
                    this.dom.headerArea.classList.remove('shadow-lg', 'text-white');
                    this.dom.titleInput.classList.remove('text-white');
                    this.dom.titleInput.classList.add('text-gray-900', 'dark:text-gray-100');
                    
                    this.dom.hideInTheater.style.display = 'block';
                    this.dom.controlsArea.className = 'controls-area flex flex-col p-4 shrink-0 border-t border-gray-300 dark:border-gray-700 transition-all duration-300';
                    this.dom.shuffleGrid.className = 'grid grid-cols-2 gap-2 mt-4 shuffle-grid';
                    this.dom.btnSpin.classList.remove('max-w-2xl', 'mx-auto', 'text-3xl', 'py-5');
                    
                    this.dom.theaterIcon.setAttribute('data-lucide', 'maximize');
                }
                lucide.createIcons({ root: this.dom.headerArea });
                this.handleResize();
            }

            destroy() {
                if(this.resizeObserver) this.resizeObserver.disconnect();
                if(this.animationRef) cancelAnimationFrame(this.animationRef);
                this.dom.wrapper.remove();
            }
        }

        // --- APP MANAGER ---
        const workspace = document.getElementById('workspace');
        let wheelInstances = [];

        const renderWheels = () => {
            workspace.className = `p-4 md:p-6 w-full max-w-[1920px] mx-auto grid gap-6 flex-1 ${appState.theaterModeId ? 'p-0 m-0 !block' : ''}`;
            if (!appState.theaterModeId) {
                if (appState.wheelsConfig.length === 1) workspace.classList.add('grid-cols-1');
                else if (appState.wheelsConfig.length === 2) workspace.classList.add('lg:grid-cols-2');
                else workspace.classList.add('md:grid-cols-2', 'xl:grid-cols-3');
            }

            appState.wheelsConfig.forEach(conf => {
                let inst = wheelInstances.find(w => w.id === conf.id);
                if (!inst) {
                    inst = new WheelApp(conf, workspace);
                    wheelInstances.push(inst);
                }
                
                if (appState.theaterModeId && appState.theaterModeId !== conf.id) {
                    inst.dom.wrapper.style.display = 'none';
                } else {
                    inst.dom.wrapper.style.display = 'flex';
                }
                
                inst.setTheaterMode(appState.theaterModeId === conf.id);
            });
        };

        const deleteWheel = (id) => {
            if (appState.wheelsConfig.length <= 1) return;
            appState.wheelsConfig = appState.wheelsConfig.filter(w => w.id !== id);
            localStorage.setItem('wheelsData', JSON.stringify(appState.wheelsConfig));
            
            const inst = wheelInstances.find(w => w.id === id);
            if(inst) {
                inst.destroy();
                wheelInstances = wheelInstances.filter(w => w.id !== id);
            }
            renderWheels();
        };

        const toggleTheaterMode = (id) => {
            appState.theaterModeId = appState.theaterModeId === id ? null : id;
            document.getElementById('navbar').style.display = appState.theaterModeId ? 'none' : 'flex';
            
            const footer = document.getElementById('main-footer');
            if (footer) footer.style.display = appState.theaterModeId ? 'none' : 'block';
            
            document.body.style.overflow = appState.theaterModeId ? 'hidden' : 'auto';
            renderWheels();
        };

        document.getElementById('btn-add-wheel').addEventListener('click', () => {
            const newWheel = {
                id: 'wheel_' + Date.now(), title: 'New Wheel', rawText: '',
                palette: 'neon', seed: generateSeed(), centerImage: ''
            };
            appState.wheelsConfig.push(newWheel);
            localStorage.setItem('wheelsData', JSON.stringify(appState.wheelsConfig));
            renderWheels();
        });

        // --- THEME ---
        const applyTheme = () => {
            if (appState.theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').innerText = '☀️';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-icon').innerText = '🌙';
            }
            wheelInstances.forEach(w => w.draw());
        };
        document.getElementById('btn-theme').addEventListener('click', () => {
            appState.theme = appState.theme === 'dark' ? 'light' : 'dark';
            saveState(); applyTheme();
        });

        // --- WINNERS TRACKING ---
        const updateWinnersUI = () => {
            const badge = document.getElementById('winners-badge');
            if (appState.winners.length > 0) {
                badge.innerText = appState.winners.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            const list = document.getElementById('winners-list');
            if (appState.winners.length === 0) {
                list.innerHTML = `<div class="text-center p-8 text-gray-500 font-medium">No winners recorded yet. Spin the wheel!</div>`;
                document.getElementById('btn-clear-winners').disabled = true;
                document.getElementById('btn-export-winners').disabled = true;
            } else {
                list.innerHTML = `<ul class="space-y-2 p-3">
                    ${appState.winners.map((w, idx) => `
                        <li class="flex items-center justify-between p-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-700/50">
                            <div class="flex flex-col">
                                <span class="font-bold text-lg">${w.winnerName}</span>
                                <span class="text-sm opacity-70 flex items-center">
                                    <span class="font-mono text-xs mr-2 opacity-70">${w.timestamp}</span> 
                                    ${w.wheelTitle}
                                </span>
                            </div>
                            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-yellow-400 to-yellow-600 flex items-center justify-center text-white font-bold text-xs shadow">
                                #${appState.winners.length - idx}
                            </div>
                        </li>
                    `).join('')}
                </ul>`;
                document.getElementById('btn-clear-winners').disabled = false;
                document.getElementById('btn-export-winners').disabled = false;
            }
        };

        const addWinner = (wheelTitle, winnerName) => {
            appState.winners.unshift({
                id: Date.now().toString(),
                wheelTitle: wheelTitle || 'Unnamed Wheel',
                winnerName: winnerName,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
            saveState(); updateWinnersUI();
        };

        const toggleWinnersModal = (show) => {
            const modal = document.getElementById('winners-modal');
            const content = document.getElementById('winners-modal-content');
            if (show) {
                modal.classList.remove('hidden');
                updateWinnersUI();
                void modal.offsetWidth;
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            } else {
                modal.classList.add('opacity-0');
                content.classList.remove('scale-100');
                content.classList.add('scale-95');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }
        };

        document.getElementById('btn-winners').addEventListener('click', () => toggleWinnersModal(true));
        document.getElementById('btn-close-winners').addEventListener('click', () => toggleWinnersModal(false));
        
        document.getElementById('btn-clear-winners').addEventListener('click', () => {
            if (confirm('Clear all winners history?')) {
                appState.winners = [];
                saveState(); updateWinnersUI();
            }
        });

        document.getElementById('btn-export-winners').addEventListener('click', () => {
            if (appState.winners.length === 0) return;
            const csv = "Time,Wheel,Winner\n" + appState.winners.map(w => `"${w.timestamp}","${w.wheelTitle}","${w.winnerName}"`).join("\n");
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'hypewheel_winners.csv';
            link.click();
        });

        // --- INIT ---
        applyTheme();
        renderWheels();
        updateWinnersUI();
        lucide.createIcons();
    </script>
</body>
</html>
